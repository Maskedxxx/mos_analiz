# Раздача собранного фронта и проксирование бэкендов внутри docker-compose.
# Имена upstream — сервисы compose: api (проверка, :8081) и gen (генерация, :8090).
server {
    listen 80;
    client_max_body_size 200m;           # загрузка документов (сканы бывают крупными)

    root /usr/share/nginx/html;
    index index.html;

    # Проверка документов. SSE-прогресс требует отключённой буферизации.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;        # аудит крупного документа идёт минуты
        proxy_send_timeout 1800s;
    }

    # Генерация документов: префикс /gen срезается (оба бэкенда отдают /api/types/*).
    location /gen/ {
        rewrite ^/gen/(.*)$ /$1 break;
        proxy_pass http://gen:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA: любой путь без файла → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
