# Конфигурация сервиса анализа драйверов производительности

# Настройки анализа драйверов
analysis:
  # Основной порог оценки для фильтрации драйверов
  primary_threshold: 9.0

  # Запасной порог, если драйверов с primary_threshold не найдено
  fallback_threshold: 7.0

# Настройки OpenAI API
openai:
  # API ключ (рекомендуется использовать переменную окружения OPENAI_API_KEY)
  # Если не указан, будет использоваться значение из переменной окружения
  api_key: ""  # Установите через переменную окружения OPENAI_API_KEY

  # Модель GPT для анализа
  model: "gpt-4.1-mini-2025-04-14"

  # Температура генерации (0 = детерминированный вывод)
  temperature: 0

# Настройки вывода
output:
  # Имя листа в итоговом Excel-отчете
  sheet_name: "Итог"

  # Папка для сохранения результатов
  results_dir: "results"
