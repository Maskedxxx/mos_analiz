services:
  # ── 1. PaddleOCR (стартует первым, 5% GPU) ────────────────────
  paddleocr:
    image: scitrera/dgx-spark-vllm:0.15.1-t4
    container_name: paddleocr-vl-15
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - /home/masked/.cache/huggingface:/root/.cache/huggingface
    command: >
      vllm serve PaddlePaddle/PaddleOCR-VL-1.5
      --trust-remote-code
      --gpu-memory-utilization 0.05
      --max-model-len 4096
      --max-num-batched-tokens 4096
      --no-enable-prefix-caching
      --served-model-name PaddleOCR-VL-1.5
      --host 0.0.0.0 --port 8010
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

  # ── 2. gpt-oss-120b (ждёт PaddleOCR, 60% GPU) ────────────────
  llm:
    image: scitrera/dgx-spark-vllm:0.15.1-t4
    container_name: gpt-oss-120b
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - /home/masked/.cache/huggingface:/root/.cache/huggingface
    command: >
      vllm serve openai/gpt-oss-120b
      --trust-remote-code
      --gpu-memory-utilization 0.60
      --max-model-len 96000
      --served-model-name openai/gpt-oss-120b
      --host 0.0.0.0 --port 8001
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      paddleocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/v1/models', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 300s

  # ── 3. API-сервер (ждёт LLM, GPU для CUDA warmup) ─────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mos-api
    network_mode: host
    ipc: host
    restart: unless-stopped
    environment:
      - AUDIT_LOGIN=${AUDIT_LOGIN:-admin}
      - AUDIT_PASSWORD=${AUDIT_PASSWORD:-mos186124kva}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-none}
    volumes:
      - /home/masked/projects/mos_analiz:/app
      - /home/masked/projects/mos_analiz/.venv:/app/.venv
      - /home/masked/.cache/huggingface:/root/.cache/huggingface
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── 4. UI (nginx + собранный React) ────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: mos-ui
    network_mode: host
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 5. Tuna-туннель (auto-reconnect) ───────────────────────────
  tuna:
    image: alpine:3.20
    container_name: mos-tuna
    network_mode: host
    restart: unless-stopped
    volumes:
      - /usr/bin/tuna:/usr/bin/tuna:ro
      - /home/masked/.config/tuna:/root/.config/tuna:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[TUNA] Подключение к mosaudit.ru.tuna.am..."
          tuna http 5173 --subdomain=mosaudit
          echo "[TUNA] Отключился, переподключение через 5с..."
          sleep 5
        done
    depends_on:
      ui:
        condition: service_healthy
